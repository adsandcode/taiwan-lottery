name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run build
      # Parsing, prize tiers, statistics and links against recorded official responses. No network.
      - run: npm run selftest
      - run: node dist/cli.js --selftest
      # The server over stdio and the CLI as separate processes, with the API mocked from fixtures/.
      - run: node scripts/smoke.mjs
      - run: node scripts/check-publish-ready.mjs
      # scripts/live-check.mjs calls the real API and is not run here.
